name: Template e2e (Sitepraat)
'on':
  push:
    branches:
      - template-e2e
  workflow_dispatch: null
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm run build
      - name: Controleer de buildoutput
        run: |
          test -f "$BUILD_OUTPUT/index.html" || { echo "::error::$BUILD_OUTPUT/index.html ontbreekt; klopt BUILD_OUTPUT?"; exit 1; }
      - uses: actions/upload-artifact@v7
        with:
          name: site
          path: ${{ env.BUILD_OUTPUT }}
          include-hidden-files: true
          retention-days: 3
  e2e:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: site
          path: out
      - name: Server opzetten
        run: |

          set -euo pipefail
          ssh-keygen -t ed25519 -N "" -f "$RUNNER_TEMP/k" -q
          docker rm -f sshd >/dev/null 2>&1 || true
          docker run -d --name sshd -p 2222:2222 \
            -e PUID=1000 -e PGID=1000 -e USER_NAME=deploy -e PASSWORD_ACCESS=true -e USER_PASSWORD=testpass123 \
            -e PUBLIC_KEY="$(cat "$RUNNER_TEMP/k.pub")" -e DOCKER_MODS=linuxserver/mods:openssh-server-rsync \
            lscr.io/linuxserver/openssh-server:latest
          for i in $(seq 1 90); do
            if docker exec sshd sh -c 'command -v rsync && test -d /config' >/dev/null 2>&1 && ssh-keyscan -p 2222 127.0.0.1 >/dev/null 2>&1; then break; fi; sleep 2
          done
          docker exec sshd sh -c 'mkdir -p /config/site/www/.well-known && echo keep > /config/site/www/.htaccess && echo keep > /config/site/www/.well-known/token && echo oud > /config/site/www/oud.html && chown -R 1000:1000 /config/site'
          ls -la out
      - name: 'rsync: sleutel en key in env'
        run: echo "SSH_PRIVATE_KEY<<EOF" >> $GITHUB_ENV; cat "$RUNNER_TEMP/k" >> $GITHUB_ENV; echo "EOF" >> $GITHUB_ENV
      - name: 'rsync: upload (template)'
        env:
          BUILD_OUTPUT: out
          SSH_HOST: 127.0.0.1
          SSH_USER: deploy
          SSH_PORT: '2222'
          SSH_KNOWN_HOSTS: ''
          DEPLOY_PATH: /config/site/www/
          ALLOW_RSYNC_PARTIAL: 'false'
          PROTECT: .htaccess,.well-known/,cgi-bin/,.user.ini,stats/,logs/
          SSH_EXTRA_OPTS: ''
        run: |
          set -euo pipefail
          for v in SSH_PRIVATE_KEY SSH_HOST SSH_USER DEPLOY_PATH; do
            [ -n "${!v}" ] || { echo "::error::Secret $v ontbreekt"; exit 1; }
          done
          # Vangrail: rsync --delete op een verkeerde map zou bv. de hele thuismap leegmaken.
          case "$DEPLOY_PATH" in
            /*/) ;;
            *) echo "::error::DEPLOY_PATH moet absoluut zijn en op / eindigen (bv. /home/user/public_html/)"; exit 1 ;;
          esac
          PORT="${SSH_PORT:-22}"

          install -m 700 -d ~/.ssh
          printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          if [ -n "${SSH_KNOWN_HOSTS:-}" ]; then
            printf '%s\n' "$SSH_KNOWN_HOSTS" > ~/.ssh/known_hosts
          else
            echo "::warning::SSH_KNOWN_HOSTS niet gezet; host key wordt ongecontroleerd opgehaald."
            ssh-keyscan -p "$PORT" -H "$SSH_HOST" > ~/.ssh/known_hosts 2>/dev/null
          fi

          SSH_CMD="ssh -p $PORT -i $HOME/.ssh/deploy_key -o StrictHostKeyChecking=yes -o BatchMode=yes $SSH_EXTRA_OPTS"
          # Op de server zelf: de doelmap moet al bestaan en mag niet / of de thuismap zijn.
          set +e
          CHECK=$($SSH_CMD "$SSH_USER@$SSH_HOST" "cd ~ && pwd -P && cd $(printf '%q' "$DEPLOY_PATH") && pwd -P")
          rc=$?
          set -e
          if [ "$rc" -eq 255 ]; then
            echo "::error::SSH-verbinding met $SSH_HOST:$PORT mislukt (sleutel, gebruiker, poort of IP-beperking bij de host)"; exit 1
          elif [ "$rc" -ne 0 ]; then
            echo "::error::DEPLOY_PATH '$DEPLOY_PATH' bestaat niet op de server"; exit 1
          fi
          REMOTE_HOME=$(sed -n 1p <<< "$CHECK")
          REMOTE_TARGET=$(sed -n 2p <<< "$CHECK")
          if [ "$REMOTE_TARGET" = "/" ] || [ "$REMOTE_TARGET" = "$REMOTE_HOME" ]; then
            echo "::error::DEPLOY_PATH wijst naar / of de thuismap ($REMOTE_TARGET); wijs naar de webroot"; exit 1
          fi

          EXCLUDES=()
          IFS=',' read -ra items <<< "$PROTECT"
          for p in "${items[@]}"; do [ -n "$p" ] && EXCLUDES+=("--exclude=/$p"); done

          set +e
          # -rlpt in plaats van -a: geen eigenaar/groep zetten (kan niet op shared hosting).
          rsync -rlptz --checksum --delete --chmod=D755,F644 "${EXCLUDES[@]}" \
            -e "$SSH_CMD" \
            out/ "$SSH_USER@$SSH_HOST:$DEPLOY_PATH"
          code=$?
          set -e
          rm -f ~/.ssh/deploy_key
          if [ "$code" -eq 23 ] && [ "$ALLOW_RSYNC_PARTIAL" = "true" ]; then
            echo "::warning::rsync exitcode 23 (host bewerkt bestanden na upload); niet fataal."
          elif [ "$code" -ne 0 ]; then
            echo "::error::rsync faalde met exitcode $code"; exit "$code"
          fi
      - name: 'rsync: controle'
        run: |

          set -euo pipefail
          docker exec sshd sh -c 'cd /config/site/www && find . -type f | sort' | tee files.txt
          (cd out && find . -type f | sort) > expected.txt
          grep -qx './index.html' files.txt && comm -23 expected.txt files.txt | grep -q . && { echo "::error::rsync: niet alles geupload"; exit 1; }
          grep -qx './index.html' files.txt || { echo "::error::rsync: nieuwe bestanden ontbreken"; exit 1; }
          grep -qx './oud.html' files.txt && { echo "::error::rsync: oud bestand niet verwijderd"; exit 1; } || true
          grep -qx './.htaccess' files.txt && grep -qx './.well-known/token' files.txt || { echo "::error::rsync: beschermde bestanden weg"; exit 1; }
          echo "rsync: OK"
      - name: 'rsync: gepinde host key'
        run: echo "PINNED<<EOF" >> $GITHUB_ENV; ssh-keyscan -p 2222 127.0.0.1 2>/dev/null >> $GITHUB_ENV; echo "EOF" >> $GITHUB_ENV
