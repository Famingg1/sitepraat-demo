              fi
              SSH_CMD="ssh -a -x -o StrictHostKeyChecking=yes"
              if [ -n "${SSH_PRIVATE_KEY:-}" ]; then
                printf '%s\n' "$SSH_PRIVATE_KEY" > ~/.ssh/deploy_key && chmod 600 ~/.ssh/deploy_key
                SSH_CMD="$SSH_CMD -i $HOME/.ssh/deploy_key"
                LFTP_PASSWORD="${LFTP_PASSWORD:-x}"
              fi
              SETTINGS="$SETTINGS set sftp:connect-program \"$SSH_CMD\";"
              ;;
            ftps)
              PORT="${FTP_PORT:-21}"
              SETTINGS="$SETTINGS set ftp:ssl-force true; set ftp:ssl-protect-data true; set ssl:verify-certificate yes;"
              ;;
